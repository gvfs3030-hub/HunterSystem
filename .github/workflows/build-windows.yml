name: Build Hunter System para Windows

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "main.py"
      - "game_data.py"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar empacotador
        run: python -m pip install --upgrade pip pyinstaller

      - name: Validar sintaxe
        run: python -m py_compile main.py game_data.py

      - name: Gerar executável Windows
        run: pyinstaller --noconfirm --clean --onefile --windowed --name HunterSystem main.py

      - name: Publicar artefato para download
        uses: actions/upload-artifact@v4
        with:
          name: HunterSystem-Windows
          path: dist/HunterSystem.exe
          if-no-files-found: error
          retention-days: 30
